[package]
name = "nim_bot" # Part of dynamic library name; we use {YourCrate} placeholder.
version = "0.1.0"     # You can leave version and edition as-is for now.
edition = "2021"

[lib]
crate-type = ["cdylib"]  # Compile this crate to a dynamic C library.

[dependencies]
evaluator = { git = "https://github.com/SecretGmG/impartial_analiser", version = "0.1.0" }
godot = "0.3.2"
sorted-vec = "0.8.6"
taking_game = { git = "https://github.com/SecretGmG/taking_game", version = "0.1.0" }
